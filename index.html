      <a class="wordmark" href="/" aria-label="Kichong home">KICHONG.XYZ</a>
    </main>
    <script>
        (() => {
          const links = [...document.querySelectorAll(".link-node")];
          const mobile = window.matchMedia("(max-width: 700px)");

          const dismiss = (except) => links.forEach((link) => {
            if (link !== except) link.classList.remove("is-revealed");
          });

          document.addEventListener("click", (event) => {
            if (!mobile.matches || event.detail === 0) return;
            const link = event.target.closest(".link-node");

            if (!link) {
              dismiss();
              return;
            }

            if (!link.classList.contains("is-revealed")) {
              event.preventDefault();
              dismiss(link);
              link.classList.add("is-revealed");
            }
          });

          mobile.addEventListener("change", ({ matches }) => {
            if (!matches) dismiss();
          });
        })();
    </script>
  </body>
